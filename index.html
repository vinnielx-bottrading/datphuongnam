<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đất Phương Nam</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="assets/ui/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/ui/favicon-16.png">
<link rel="apple-touch-icon" href="assets/ui/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#2A1C14">
<meta name="apple-mobile-web-app-title" content="Đất Phương Nam">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=Lobster&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-view="loading">
<script src="https://vinhlamgame.vercel.app/vlg.js" data-game="dat-phuong-nam" defer></script>
<main class="stage">
  <canvas id="game" width="1280" height="720" aria-label="Màn chơi Đất Phương Nam"></canvas>

  <div class="topbtns">
    <button id="btnPause" type="button" aria-label="Tạm dừng">❚❚</button>
    <button id="btnMute" type="button" aria-label="Bật/tắt âm thanh">♪</button>
  </div>

  <div class="touch-ui" aria-hidden="true">
    <button id="tLeft" type="button">◀</button><button id="tRight" type="button">▶</button>
    <button id="tJump" type="button" class="jump">Nhảy</button>
  </div>

  <!-- ===== Tải ===== -->
  <section class="screen menu" id="loading">
    <div class="load"><p class="logo-sm">Đất Phương Nam</p><div class="bar"><i id="loadBar"></i></div><p>Đang tải hình ảnh…</p></div>
  </section>

  <!-- ===== Màn hình chính ===== -->
  <section class="screen menu" id="home" hidden>
    <div class="home-bg" aria-hidden="true"></div>
    <h1 class="logo"><img src="assets/ui/logo.webp" alt="Đất Phương Nam"></h1>
    <button class="round-btn" id="btnSettings" type="button" aria-label="Cài đặt"><img src="assets/ui/icon_settings.webp" alt=""></button>
    <nav class="signpost" aria-label="Menu chính">
      <button class="plank big" id="btnStart" type="button"><span class="ic"><img src="assets/ui/icon_start.webp" alt=""></span><span>Bắt đầu<br>hành trình</span><i>▶</i></button>
      <button class="plank" id="btnChapters" type="button"><span class="ic"><img src="assets/ui/icon_chapters.webp" alt=""></span><span>Chọn chương</span><i>▶</i></button>
      <button class="plank" id="btnContinue" type="button"><span class="ic"><img src="assets/ui/icon_continue.webp" alt=""></span><span>Tiếp tục hành trình<small></small></span><i>▶</i></button>
      <button class="plank" id="btnSettings2" type="button"><span class="ic"><img src="assets/ui/icon_settings.webp" alt=""></span><span>Cài đặt</span><i>▶</i></button>
    </nav>
    <nav class="tiles" aria-label="Mục phụ">
      <button type="button" data-panel="journal"><img src="assets/ui/icon_journal.webp" alt=""><span>Nhật ký</span></button>
      <button type="button" data-panel="items"><img src="assets/ui/icon_items.webp" alt=""><span>Vật phẩm</span></button>
      <button type="button" data-panel="village"><img src="assets/ui/icon_village.webp" alt=""><span>Xóm làng</span></button>
      <button type="button" data-panel="achieve"><img src="assets/ui/icon_achieve.webp" alt=""><span>Thành tích</span></button>
      <button type="button" data-panel="chars"><img src="assets/ui/icon_chars.webp" alt=""><span>Nhân vật</span></button>
      <button type="button" class="tile-donate" id="btnDonate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span>Ủng hộ</span></button>
    </nav>
  </section>

  <!-- ===== Chọn chương ===== -->
  <section class="screen menu paper" id="chapters" hidden>
    <header class="bar-top"><button type="button" class="back" data-back="home">◀ Màn hình chính</button><h2>Chọn chương</h2></header>
    <div class="chap-grid" id="chapterCards"></div>
  </section>

  <section class="screen menu paper" id="chapter" hidden>
    <header class="bar-top"><button type="button" class="back" data-back="chapters">◀ Chọn chương</button><h2 id="chapTitle"></h2></header>
    <div class="tap-list" id="tapList"></div>
  </section>

  <!-- ===== Giới thiệu cửa ===== -->
  <section class="screen" id="intro" hidden>
    <div class="card">
      <p class="kicker" id="introKicker"></p>
      <h2 id="introName"></h2>
      <p id="introGoal"></p>
      <ul class="keys">
        <li><kbd>←</kbd><kbd>→</kbd> chạy</li>
        <li><kbd>Space</kbd>/<kbd>↑</kbd> nhảy (giữ để nhảy cao)</li>
        <li><kbd>P</kbd> tạm dừng</li>
      </ul>
      <p class="note" id="introBest"></p>
      <button type="button" class="primary" id="btnPlay">Vào cửa</button>
      <button type="button" data-back="c1list">Chọn cửa khác</button>
    </div>
  </section>

  <!-- ===== Cài đặt ===== -->
  <section class="screen" id="settings" hidden>
    <div class="card">
      <h2>Cài đặt</h2>
      <label class="opt"><input type="checkbox" id="optMusic"> Nhạc nền & âm môi trường</label>
      <label class="opt"><input type="checkbox" id="optSound"> Hiệu ứng âm thanh</label>
      <button type="button" id="btnReset">Xóa tiến độ</button>
      <button type="button" class="primary" data-back="home">Xong</button>
    </div>
  </section>

  <!-- ===== Ủng hộ ===== -->
  <section class="screen" id="donate" hidden>
    <div class="card wide"><div data-donate></div><button type="button" class="primary" data-back="home">Đóng</button></div>
  </section>

  <!-- ===== Bảng phụ ===== -->
  <section class="screen" id="panel" hidden>
    <div class="card wide"><h2 id="panelTitle"></h2><div id="panelBody" class="panel-body"></div><button type="button" class="primary" data-back="home">Đóng</button></div>
  </section>

  <!-- ===== Trong màn chơi ===== -->
  <section class="screen" id="pause" hidden>
    <div class="card"><h2>Tạm dừng</h2><button type="button" class="primary" id="btnResume">Chơi tiếp</button><button type="button" id="btnRestart">Chơi lại cửa này</button><button type="button" id="btnQuit">Về chọn cửa</button></div>
  </section>
  <section class="screen" id="win" hidden>
    <div class="win-wrap">
      <div class="card win-card"><p class="kicker">Hoàn thành</p><h2 id="winTitle">Qua cửa!</h2><ul class="win-stars" id="winStars"></ul><p id="winStats"></p>
        <div class="next-cua" id="winNext"></div>
        <button type="button" class="primary" id="btnWinNext">Vào cửa tiếp theo</button>
        <div class="row2"><button type="button" id="btnWinAgain">Chơi lại</button><button type="button" id="btnWinMap">Bản đồ</button></div></div>
      <aside class="card" data-donate="compact"></aside>
    </div>
  </section>
  <section class="screen" id="over" hidden>
    <div class="card"><h2>Nam kiệt sức rồi</h2><p>Nghỉ một chút rồi thử lại nhé. Mẹo: thấy bong bóng thì nhảy đi ngay.</p>
      <button type="button" class="primary" id="btnOverAgain">Thử lại</button><button type="button" id="btnOverQuit">Về chọn cửa</button></div>
  </section>

  <div class="rotate" aria-hidden="true"><p>Xoay ngang điện thoại để chơi</p></div>
</main>

<script src="js/assets-meta.js"></script>
<script src="js/engine.js"></script>
<script src="js/player.js"></script>
<script src="js/entities.js"></script>
<script src="js/level.js"></script>
<script src="js/levels/tap1_cua1.js"></script>
<script src="js/chapters.js"></script>
<script src="js/sfx.js"></script>
<script src="js/music.js"></script>
<script src="js/lib/qrcode.js"></script>
<script src="js/donate.js"></script>
<script src="js/menu.js"></script>
<script src="js/main.js"></script>
</body>
</html>
